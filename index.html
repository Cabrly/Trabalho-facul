<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kanban | Kaizen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="logo">

            <span class="logo-jp">
                改善
            </span>

            <div>
                <h1>KAIZEN</h1>
                <p>Kanban Board</p>
            </div>

        </div>

        <button
            class="add-task"
            type="button"
        >
            <span>+</span>
            Nova tarefa
        </button>

    </header>


    <main class="container">

        <!--
            Deve existir vazio
            antes do JavaScript alterar.
        -->

        <p
            class="estado"
            data-estado
            role="status"
            aria-live="polite"
        ></p>


        <section class="intro">

            <div>

                <span class="tag">
                    今日の仕事
                </span>

                <h2>
                    Organize seu fluxo de trabalho
                </h2>

                <p>
                    Pequenos passos, grandes resultados.
                    Organize suas tarefas seguindo
                    o princípio Kaizen.
                </p>

            </div>


            <div class="progress">

                <span>Progresso</span>

                <strong id="progresso-texto">
                    0%
                </strong>

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        id="progresso-barra"
                    ></div>

                </div>

            </div>

        </section>


        <section
            class="kanban"
            id="quadro"
            aria-label="Quadro de tarefas"
        >


            <section
                class="column"
                data-coluna="a-fazer"
            >

                <div class="column-header">

                    <div class="column-title">

                        <span
                            class="status black"
                        ></span>

                        <h3>A fazer</h3>

                    </div>

                    <span
                        class="task-count"
                        data-contador="a-fazer"
                    >
                        0
                    </span>

                </div>


                <div
                    class="tasks"
                    data-tarefas="a-fazer"
                ></div>


                <button
                    class="add-column-task"
                    type="button"
                >
                    + Adicionar tarefa
                </button>

            </section>


            <section
                class="column"
                data-coluna="em-andamento"
            >

                <div class="column-header">

                    <div class="column-title">

                        <span
                            class="status red"
                        ></span>

                        <h3>
                            Em andamento
                        </h3>

                    </div>

                    <span
                        class="task-count"
                        data-contador="em-andamento"
                    >
                        0
                    </span>

                </div>


                <div
                    class="tasks"
                    data-tarefas="em-andamento"
                ></div>


                <button
                    class="add-column-task"
                    type="button"
                >
                    + Adicionar tarefa
                </button>

            </section>


            <section
                class="column"
                data-coluna="em-revisao"
            >

                <div class="column-header">

                    <div class="column-title">

                        <span
                            class="status review"
                        ></span>

                        <h3>
                            Em revisão
                        </h3>

                    </div>

                    <span
                        class="task-count"
                        data-contador="em-revisao"
                    >
                        0
                    </span>

                </div>


                <div
                    class="tasks"
                    data-tarefas="em-revisao"
                ></div>


                <button
                    class="add-column-task"
                    type="button"
                >
                    + Adicionar tarefa
                </button>

            </section>


            <section
                class="column"
                data-coluna="concluido"
            >

                <div class="column-header">

                    <div class="column-title">

                        <span
                            class="status done"
                        ></span>

                        <h3>
                            Concluído
                        </h3>

                    </div>

                    <span
                        class="task-count"
                        data-contador="concluido"
                    >
                        0
                    </span>

                </div>


                <div
                    class="tasks"
                    data-tarefas="concluido"
                ></div>


                <button
                    class="add-column-task"
                    type="button"
                >
                    + Adicionar tarefa
                </button>

            </section>

        </section>

    </main>


    <footer>

        <p>
            一歩ずつ — Um passo de cada vez.
        </p>

    </footer>


    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
